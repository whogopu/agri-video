# All tunable settings and backend choices. Stages read this; nothing else is hard-coded.
# Scene change = padding after the narration (the 0.33 s crossfade sits at its end) + lead-in of the new
# scene (picture first, then voice). Audible gap ≈ padding − crossfade + lead-in + ~0.13 s of take room
# ≈ 1.0 s: longer than any pause inside a scene (sentence ≈ 0.45 s, || ≈ 0.78 s), so a new scene is heard
# as a new idea. Lead-in > crossfade, so the new picture is fully in before the narrator speaks.
# (Was padding 0.35, no lead-in: only ~0.15 s between scenes; user feedback 2026-11-19.)
video: { fps: 30, scene_padding_sec: 0.8, scene_lead_in_sec: 0.4 }

# Chosen per episode with `new_episode --format long|short` (stored in episode.json "format").
# long  = landscape 16:9 YouTube video, 3–5 min
# short = vertical 9:16 YouTube Short, 30–60 s (stand-alone; re-cutting a long episode is v1)
formats:
  long:
    width: 1920
    height: 1080
    target_sec: [180, 300]   # 3–5 min; word target = target_sec × voice wpm
    image_size: [1344, 768]
  short:
    width: 1080
    height: 1920
    target_sec: [30, 60]
    image_size: [768, 1344]
    max_sec: 60
    caption_max_words: 4   # narrower frame → shorter caption chunks

script:
  cta_hi: "ऐसी और जानकारी के लिए चैनल को सब्सक्राइब करें।"
  # Scene purposes whose claims must be backed by a file in sources/.
  # Any scene containing a digit also needs a source, whatever its purpose.
  factual_purposes: [problem, explain, step, mistake]

tts:
  backend: parler
  model: ai4bharat/indic-parler-tts
  # Voice presets. Pick one per episode: `new_episode <slug> --voice aman` (default below).
  # `wpm` is the measured pace on this Mac (phase 3 auditions); validate uses it to estimate length.
  # {speaker} in a description is filled in from `speaker`. "very clear audio" is the model card's quality tip.
  # Other Hindi speakers on the model card: Divya (recommended), Rani. For a slower pace, use
  # "speaking at a slightly slow speed with a moderate pitch, like a patient teacher" (~150–160 wpm).
  default_voice: maya_vasant   # chosen 2026-11-19: maya_vasant (male), veena_varun (female); see docs/ARCHITECTURE.md D22
  voices:
    rohit:
      speaker: Rohit
      wpm: 171
      description: "{speaker}'s voice is calm and clear, with a moderate speed and pitch. The recording is very close-sounding with no background noise. very clear audio."
    aman:
      speaker: Aman
      wpm: 191
      description: "{speaker}'s voice is calm and clear, with a moderate speed and pitch. The recording is very close-sounding with no background noise. very clear audio."
    # --- other open models (comparison 2026-11-19), all via mlx-audio in the tts-mlx/ env ---
    # Maya2 Native (Apache-2.0; Mimi codec CC-BY-4.0, attribution): 20 built-in voices, no reference audio.
    maya_vasant:   # PRODUCTION male voice
      backend: mlx_audio
      model: maya-research/maya2-native
      speaker: Vasant
      lang: hi
      wpm: 174
      params: { normalize: false }
      # respellings sent only to this voice (pronunciation.yaml is for all voices); test each with Whisper:
      # जांच → जाञ्च: heard right 3/4 vs 0/4, and the user confirmed it sounds better (2026-11-19). Veena gets worse with it, so not global.
      pronunciation: { "जांच": "जाञ्च", "जाँच": "जाञ्च" }
    maya_satvik: { backend: mlx_audio, model: maya-research/maya2-native, speaker: Satvik, lang: hi, wpm: 171 }
    maya_abhay:  { backend: mlx_audio, model: maya-research/maya2-native, speaker: Abhay,  lang: hi, wpm: 171 }
    # Chatterbox Multilingual v3 (MIT, PerTh watermark): copies the voice of a reference clip. Only SYNTHETIC
    # references (our own Parler takes), never a real person: CLAUDE.md, user decision 2026-11-19.
    chatterbox_rohit:
      backend: mlx_audio
      model: mlx-community/chatterbox-multilingual-v3
      family: chatterbox
      speaker: ""
      lang: hi
      wpm: 171
      ref_audio: assets/voices/rohit-ref.wav     # Parler Rohit, demo episode scene 18
      ref_text: "तीसरी गलती, नमूने के लिए खाद या दवा की पुरानी बोरी इस्तेमाल करना। हमेशा साफ़ बाल्टी और साफ़ थैली ही इस्तेमाल करें।"
      params: { exaggeration: 0.5, cfg_weight: 0.5, temperature: 0.8 }
    # Indic-Speak (Bodhan AI; Indic Open Model License v1.0 + Llama 3.2): built-in voices, style tags.
    # Community MLX bf16 conversion, run by our own worker (no repo code executed).
    indic_speak_amit:
      backend: mlx_audio
      worker: snac_lm_worker.py
      flavor: indic_speak
      model: iniquitous/indic-speak-mlx-bf16
      family: indic_speak
      speaker: Amit
      lang: hi
      wpm: 171
      params: { temperature: 0.6 }
    # Veena (Maya Research, Apache-2.0): 4 built-in voices (agastya = male), no style control.
    veena_agastya:
      backend: mlx_audio
      worker: snac_lm_worker.py
      flavor: veena
      model: maya-research/Veena
      family: veena
      speaker: agastya
      lang: hi
      wpm: 171
    veena_varun:   # PRODUCTION female voice. Despite the name, female (~230 Hz).
      backend: mlx_audio
      worker: snac_lm_worker.py
      flavor: veena
      model: maya-research/Veena
      family: veena
      speaker: varun
      lang: hi
      wpm: 176
      takes: 6     # ~1 take in 5 drifts to a different (lower) voice; scoring rejects those, more takes = safer
  seed: 42
  device: mps
  out_sample_rate: 48000

audio: { target_lufs: -14, true_peak_db: -1.5 }

# How narration is produced (pipeline/narration.py, pipeline/prosody.py, pipeline/take_scoring.py).
narration:
  # segments: one TTS call per sentence / pause mark, several takes each, best take picked by score,
  #           joined with controlled pauses. scene: v0 behaviour, one TTS call per scene.
  mode: segments
  takes: 4                 # takes per segment (seed = voice seed + take index); more = better odds, slower
  # silence inserted after a segment, by what ends it. Each segment also keeps ~60 ms of its own
  # room on both sides after trimming, so the audible gap is about this + 0.12 s.
  pauses_sec: { short: 0.12, sentence: 0.32, exclaim: 0.38, question: 0.50, long: 0.65, end: 0.0 }
  room_tone_db: -66        # steady, very quiet pink noise under the narration (null = digital silence)
  # Delivery styles: Parler voice descriptions ({speaker} is filled in). `params.<family>` = generate()
  # options for other models, where family = the voice preset's `family` (e.g. chatterbox: exaggeration
  # 0.25–2, higher = more expressive). Maya2 has no style control (speed fixed; pauses still apply). 'neutral' = the episode
  # voice's own description. Parler understands pitch, speed, expressivity ("monotone" ↔
  # "expressive and animated"), recording quality. Keep the speaker name so the voice stays the same.
  styles:
    question: { description: "{speaker}'s voice is clear and slightly expressive and animated, with a moderate speed and a slightly high pitch. The recording is very close-sounding with no background noise. very clear audio.", params: { chatterbox: { exaggeration: 0.65 } } }
    slow:     { description: "{speaker}'s voice is calm and clear, speaking at a slightly slow speed with a moderate pitch, like a patient teacher. The recording is very close-sounding with no background noise. very clear audio.", tempo: 0.97 }
    warm:     { description: "{speaker}'s voice is warm, friendly and slightly expressive, with a moderate speed and pitch. The recording is very close-sounding with no background noise. very clear audio.", params: { chatterbox: { exaggeration: 0.6 } } }
    firm:     { description: "{speaker}'s voice is clear and firm, slightly expressive, with a moderate speed and a slightly low pitch. The recording is very close-sounding with no background noise. very clear audio." }
  # automatic style when a segment has no {style} mark
  auto_style:
    question: question     # segment ends with '?'
    digits: slow           # what the viewer sees has a number in it
    purpose: { cta: warm, mistake: firm }
  asr:
    backend: whisper       # whisper (asr/ env, mlx-whisper) | none (lengths only; tests)
    model: mlx-community/whisper-large-v3-turbo
    language: hi
  score_weights: {}        # override pipeline/take_scoring.py DEFAULT_WEIGHTS
  word_timing:             # when each word is spoken → audio.words (pipeline/word_align.py); captions/graphics cue on it
    enabled: true
    prompt_script: true    # give Whisper the script as a hint: spelling closer to the script → better alignment (timing only, never scoring)
    silence_db: 35         # a frame this many dB below the loudest is silence
    silence_min_sec: 0.08  # shorter quiet runs are ignored
    snap_tol_sec: 0.05     # Whisper starts words after a pause too early; starts in (or this close before) a silence move to its end
    min_segment_match: 0.6 # share of a sentence's letters matched; below this its words are spread by letter count

images:
  backend: mflux
  # FLUX.2 [klein] 4B, pre-quantized 4-bit (Apache-2.0, 4.6 GB, peak ~3.7 GB RAM).
  # The brief's FLUX.1 schnell q8 is 18 GB and doesn't fit 16 GB RAM; schnell q4 (9.6 GB) is the fallback:
  #   command: mflux-generate, model: mflux-community/flux-1-schnell-mflux-q4, base_model: schnell, guidance: null
  command: mflux-generate-flux2
  # Shots that show cast members (assets/cast/) use the same model in edit mode, conditioned on the
  # characters' approved reference images (~40 s with one reference, ~90 s with two).
  edit_command: mflux-generate-flux2-edit
  model: mflux-community/flux2-klein-4b-mflux-q4
  base_model: flux2-klein-4b
  steps: 4
  guidance: 1.0
  quantize: null          # weights are already quantized
  # image size comes from formats.<format>.image_size (multiples of 16)
  style_suffix: "photorealistic, rural India, natural daylight, documentary photography, no readable signs, no captions, no watermark"  # illegible incidental text is fine (see inspection_checklist)
  max_attempts: 3
  # Checked for EVERY generated image, at full size + zoomed crops (`images --crops`), person by person.
  # Recorded with `images --inspect pass|fail`; validate blocks visuals_ready until each image passes.
  # Shown by images.py, written into review.md, and used for rendered frames in the review stage.
  inspection_checklist:
    - "Hands & arms: every person has exactly 2 arms and 2 hands, each hand connected to its own arm; no extra, missing or floating hands. Both hands should normally be VISIBLE and doing something natural; a person whose second arm is hidden behind the body or clothing looks one-armed and fails (exception: the person is cropped by the frame edge or it's a close-up of hands only)"
    - "Separate people: hands, arms and bodies of different people never merge or fuse. Where people touch or pass an object (a hand-over, a handshake), every hand is complete and clearly separate, with a visible gap or the object between them; you can tell whose hand is whose by following each arm"
    - "Fingers: every visible hand has 5 fingers (or fewer only when naturally hidden), natural joints, no fused, extra or melted fingers"
    - "Legs & feet: every person has exactly 2 legs and 2 feet, connected and the right size"
    - "Posture: physically possible — knees, elbows and feet bend the right way, squatting/standing/walking pose is balanced, head and neck natural"
    - "Dress: correct and consistent for rural India and the role (kurta-pyjama, dhoti, saree/salwar, turban; officer in a plain shirt), no garment merging into skin, ground or objects"
    - "Tools & objects: one tool = one blade and one handle, held the right way by hands that belong to the person (spade blade in soil, bucket by its handle, paper by its edges); no tools fused to each other or to buckets"
    - "Faces & people: natural faces, no duplicated or merged people, no stray limbs from out-of-frame people"
    - "Identity (cast shots): compare with the reference side by side (`--crops` writes *-vs-<id>.png). Same face, hair and hairline, facial hair, age and build; same clothes and colours; nothing added (turban, cap, glasses, jewellery) unless the shot asks for it. Another face = fail, even if the image is otherwise fine"
    - "Action & physics (user rule 2026-11-20): trace every poured, thrown, sprayed or falling material (khaad, seed, water, soil, spray) back to a believable source: an OPEN throwing hand, the mouth of a TILTED container, a nozzle. It must never come out of a closed fist, a hand gripping a handle, an upright bucket or thin air. Container angle matches the flow; the landing matches the action (broadcasting spreads thinly, it doesn't form one heap); objects rest on something or are held; nothing floats or passes through solids. A hand posed to throw must actually throw. Notes for every pass need 'action: ...' ('action: static' for a still scene)"
    - "Narration & good practice: the picture shows what the narration says, and the farming in it is correct: crop and stage (no wheat ears on 'young wheat'; urea on a growing crop, not one that has headed), method, tool, quantity looks plausible (half a kilo is not a pinch), clean equipment where the script says clean. A picture that teaches the wrong thing fails even if every hand is perfect"
    - "Context: Indian rural setting (North India for our audience: mud-brick or brick houses, neem/shisham/peepal; no coastal palm groves or painted concrete bungalows) and the right crop/stage for the narration"
    - "Text: no READABLE words, numbers, brand names or logos. Illegible text where real objects have it is GOOD and looks realistic — keep it: notice boards, wall charts and posters in labs/offices/KVKs/shops, labels on sacks or bags, and documents people hold (a soil report should look like a printed report with tables/lines, not a blank sheet). Blank paper or bare institutional walls look fake"

shots:
  # An image scene holds 1–3 shots that cut on sentence boundaries (visual.shots[].at_segment).
  min_shot_sec: 2.5        # validate warns below this: a picture needs time to be read
  max_shot_sec: 9          # validate warns above this: a still held longer feels static
  fade_frames: 6           # quick dissolve between shots inside a scene (SHOT_FADE_FRAMES in theme.ts)

captions:
  max_words_per_chunk: 6                 # long format; Shorts use formats.short.caption_max_words
  font_size_px: { long: 56, short: 64 }  # caption text size at full resolution; render.py passes it to Remotion

render:
  draft_scale: 0.5                     # 540p drafts (1080×1920 Shorts → 540×960)
  concurrency: 4                       # fanless Mac: moderate; frame rendering is the bottleneck
  hardware_acceleration: if-possible   # VideoToolbox H.264: same speed, ~half the CPU/heat
  crossfade_frames: 10                 # must match TRANSITION_FRAMES in remotion/src/theme.ts

review: { frame_interval_sec: 2, frames_per_sheet: 12 }

package:
  thumbnail_size: { long: [1280, 720], short: [1080, 1920] }
  disclaimer_hi: "यह वीडियो सामान्य जानकारी के लिए है। किसी भी खाद, दवा या योजना से जुड़ा फैसला लेने से पहले उत्पाद का लेबल पढ़ें और अपने नज़दीकी कृषि विज्ञान केंद्र (KVK) या कृषि अधिकारी से सलाह लें।"
