[project]
name = "agri-video-asr"
version = "0.1.0"
description = "Isolated env for take scoring: mlx-whisper (transcribe takes) + librosa (pitch/pauses). Called as a subprocess by pipeline/take_scoring.py."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper>=0.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy<2.3",
]

[tool.uv]
package = false
