# Image model bake-off: scene specs (approved shot list 2026-11-21)
#
# A scene spec is the structured description Claude writes BEFORE any prompt. pipeline/scene_spec.py lints it
# (every hand, held object and moving material accounted for) and renders one natural-language prompt that
# every model in the bake-off receives unchanged, so differences come from the model, not the prompt.
# Write only what IS in the picture (no negations; visual_rules lint runs on the rendered prompt).
# {kind:key} tokens expand to tested phrases from assets/visual_rules.yaml.
#
# Slots
#   teaches          what the viewer should learn from this picture (lint)
#   framing          shot size, camera height/angle, lens, how much of each body is in frame (lint)
#   setting          place, season, time of day, light, background (lint)
#   crop_stage       what is growing / bare / harvested, or null for indoor shots
#   people[]         role, gender (man|woman), age, build, clothes, posture, gaze;
#                    left_hand / right_hand: {holds, grip} -> every hand accounted for (lint)
#   objects[]        name, count, state, support (what it rests on / who holds it) (lint)
#   flows[]          material, source (open hand / tilted container mouth / nozzle), path, landing
#                    (lint: required when anything pours, scatters or sprays)
#   contacts[]       where hands touch objects or other people, in one plain sentence each
#   inspector_notes  known failure modes, for inspection only (never sent to the model)

style: "photorealistic documentary photograph, natural colours, realistic skin texture, sharp focus"

shots:

  - id: B01
    title: "broadcast urea from an open hand"
    source: "v3 scene 1 (failed 3x: closed fist, upright bucket pouring, heap)"
    teaches: "urea is broadcast thinly and evenly over a young crop, from an open hand"
    framing: "medium-wide shot at eye level, 35 mm lens, the farmer's whole body from head to feet in frame, three-quarter view from his right side"
    setting: "a North Indian field on a clear winter morning, low soft sunlight from the left; {setting:north_field_bg}"
    crop_stage: "{stage:young_wheat}"
    people:
      - role: farmer
        gender: man
        age: "about 45"
        build: "lean, medium height, sun-tanned skin, short black hair with some grey, thick black moustache"
        clothes: "a loose white cotton kurta, a white dhoti, a red-and-white checked gamcha over his left shoulder, brown leather chappals"
        posture: "walking slowly along a crop row, right foot stepping forward"
        gaze: "looking at the soil ahead of him"
        left_hand: {holds: "steel bucket", grip: "the bucket's thin wire handle hooked over his bent left forearm near the elbow, his left hand relaxed in front of his stomach"}
        right_hand: {holds: null, grip: "his right arm swung out to the side at shoulder height, the hand wide open and turned downward, five fingers spread"}
    objects:
      - {name: "stainless-steel bucket", count: 1, state: "upright, three-quarters full of white granules", support: "hanging from his left forearm by its wire handle"}
    flows:
      - {material: "small white urea granules", source: "leaving the spread fingers of his open right hand", path: "a thin wide fan through the air to his right", landing: "scattered thinly and evenly over the soil between the young wheat rows"}
    contacts:
      - "the wire handle of the bucket rests in the crook of his left elbow"
    inspector_notes:
      - "granules start at the OPEN right hand; any stream from the bucket mouth = fail (bucket is upright)"
      - "landing spread thin, not a heap; wheat has leaves only, no ears"

