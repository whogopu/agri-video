[project]
name = "agri-video"
version = "0.1.0"
description = "AgriGate Hindi educational video pipeline (v0)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2",
    "pillow>=13.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
