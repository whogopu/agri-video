<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image model rating</title>
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --panel2:#f0f2ef; --line:#dde2dc; --text:#1b231d; --muted:#647067;
  --brand:#3fb660; --brand-dark:#0a6132; --brand-soft:#e3f4e8;
  --warn:#b7791f; --warn-soft:#fbf1dc; --bad:#c53030; --bad-soft:#fbe4e4;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --panel:#171c19; --panel2:#1d2420; --line:#2a332d; --text:#e4ebe6; --muted:#8c9a90;
  --brand-soft:#173322; --warn-soft:#3a2c12; --bad-soft:#3d1a1a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0}
a{color:var(--brand-dark)} @media (prefers-color-scheme: dark){a{color:var(--brand)}}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 12px}
button:hover{border-color:var(--brand)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.imgwrap{background:#000;border-radius:10px;overflow:auto;max-height:calc(100vh - 110px);cursor:zoom-in}
.imgwrap img{display:block;width:100%;height:auto}
.imgwrap.zoom{cursor:zoom-out} .imgwrap.zoom img{width:auto;max-width:none}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-size:15px;margin:0 0 4px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.card ul{margin:0;padding-left:18px}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.verdicts button{padding:10px 4px;font-weight:600}
.verdicts button.on[data-v=pass]{background:var(--brand-soft);border-color:var(--brand)}
.verdicts button.on[data-v=minor]{background:var(--warn-soft);border-color:var(--warn)}
.verdicts button.on[data-v=fail]{background:var(--bad-soft);border-color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{padding:3px 9px;font-size:12.5px;border-radius:999px}
.tags button.on{background:var(--bad-soft);border-color:var(--bad)}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:6px;min-height:52px}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.bar div{height:100%;background:var(--brand)}
details{font-size:12.5px} details pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:6px 0 0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel2)}
.empty{padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Image model rating</h1>
  <span class="muted">Blind: model names are hidden and order is shuffled. Pass = good enough to use; Minor = small flaws you'd accept; Fail = you'd regenerate it.</span>
  <div class="bar"><div id="progress" style="width:0"></div></div>
  <span id="count" class="muted"></span>
  <label class="muted">Show <select id="view"><option value="unrated">unrated</option><option value="reason">minor/fail without a note</option><option value="all">all</option></select></label>
  <a href="/">← control room</a>
</header>
<main id="main"><div class="empty muted">Loading…</div></main>
<script>
let data = {items: [], ratings: {}, tags: []}, list = [], pos = 0, cur = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(keepId) {
  data = await (await fetch('/api/bakeoff/items')).json();
  filter(keepId);
}
function filter(keepId) {
  const v = $('#view').value;
  list = data.items.filter(i => i.id === keepId || keep(i));
  pos = Math.max(0, list.findIndex(i => i.id === keepId));
  if (pos < 0) pos = 0;
  render();
}
function needsReason(r) { return r && r.verdict !== 'pass' && !(r.note || '').trim(); }
function keep(i) {
  const v = $('#view').value, r = data.ratings[i.id];
  return v === 'all' || (v === 'unrated' && !r) || (v === 'reason' && needsReason(r));
}
function render() {
  const done = data.items.filter(i => data.ratings[i.id]).length, total = data.items.length;
  $('#count').textContent = `${done} / ${total} rated`;
  $('#progress').style.width = total ? (100 * done / total) + '%' : 0;
  if (!list.length) {
    $('#main').innerHTML = `<div class="empty muted">${total ? ($('#view').value === 'reason' ? 'Every Minor and Fail now has a note. Thank you!' : 'Nothing left in this view. Pick “all” to review your ratings.') : 'No images yet. Run <code>uv run python -m pipeline.bakeoff blind</code> after a generation run.'}</div>`;
    return;
  }
  const it = list[pos], r = data.ratings[it.id] || {};
  cur = {id: it.id, verdict: r.verdict || null, tags: new Set(r.tags || []), note: r.note || ''};
  $('#main').innerHTML = `
    <div class="imgwrap" id="wrap" title="click to zoom to full size"><img src="/bakeoff-img/${it.id}" alt="${esc(it.title)}"></div>
    <div class="side">
      <div class="card"><h3>Shot ${esc(it.shot)} · image ${pos + 1} of ${list.length}</h3><h2>${esc(it.title)}</h2>
        <div class="muted">Teaches: ${esc(it.teaches)}</div></div>
      <div class="card"><h3>Check</h3><ul>${(it.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}
        <li>every person: 2 arms, 2 hands, 5 fingers, 2 legs; nobody's hands merged</li><li>looks like rural North India; nothing readable</li></ul>
        <details><summary>Full prompt</summary><pre>${esc(it.prompt)}</pre></details></div>
      <div class="card"><h3>Your verdict</h3>
        <div class="verdicts">${['pass','minor','fail'].map((v, k) => `<button data-v="${v}" class="${cur.verdict === v ? 'on' : ''}" onclick="setV('${v}')">${v === 'pass' ? 'Pass' : v === 'minor' ? 'Minor' : 'Fail'} <kbd>${k + 1}</kbd></button>`).join('')}</div>
        <h3 style="margin-top:12px">What's wrong (optional)</h3>
        <div class="tags">${data.tags.map(t => `<button class="${cur.tags.has(t) ? 'on' : ''}" onclick="togTag(this, '${esc(t)}')">${esc(t)}</button>`).join('')}</div>
        <h3 style="margin-top:12px">Note (optional)</h3>
        <textarea id="note" placeholder="e.g. left hand has 6 fingers">${esc(cur.note)}</textarea>
        ${cur.verdict ? `<button style="margin-top:8px;width:100%" onclick="saveReason()">Save reason, keep verdict “${cur.verdict}” <kbd>⌘↵</kbd></button>` : ''}
      </div>
      <div class="nav"><button onclick="go(-1)">← Prev <kbd>←</kbd></button><span class="muted" style="font-size:12px">verdict saves &amp; moves on</span><button onclick="go(1)">Next <kbd>→</kbd></button></div>
    </div>`;
  $('#wrap').onclick = e => e.currentTarget.classList.toggle('zoom');
}
function togTag(btn, t) { cur.tags.has(t) ? cur.tags.delete(t) : cur.tags.add(t); btn.classList.toggle('on'); }
async function setV(v) {
  cur.verdict = v;
  await save();
}
function saveReason() { if (cur && cur.verdict) save(); }
async function save() {
  const v = cur.verdict;
  const body = {id: cur.id, verdict: v, tags: [...cur.tags], note: $('#note').value};
  const res = await fetch('/api/bakeoff/rate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!res.ok) { alert('Could not save: ' + (await res.json()).error); return; }
  data.ratings[cur.id] = await res.json();
  if (!keep(list[pos])) { list.splice(pos, 1); if (pos >= list.length) pos = 0; } else go(1, true);
  render();
}
function go(d, quiet) { if (!list.length) return; pos = (pos + d + list.length) % list.length; if (!quiet) render(); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveReason(); } return; }
  if (e.key === '1') setV('pass'); else if (e.key === '2') setV('minor'); else if (e.key === '3') setV('fail');
  else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
$('#view').onchange = () => filter();
if (location.hash === '#reason') $('#view').value = 'reason';
load();
</script>
</body>
</html>
